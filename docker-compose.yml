name: nexastore

services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - nexastore-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:0.40.6
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - nexastore-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    profiles: ["ollama"]

  ollama-model:
    image: ollama/ollama:0.40.6
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${OLLAMA_MODEL:-qwen3.5:4b}"]
    volumes:
      - nexastore-ollama:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    profiles: ["ollama"]

  nexastore-api:
    build:
      context: .
      dockerfile: backend/NexaStore.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NexaStore: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Database__ApplyMigrationsOnStartup: "true"
      AI__Enabled: "true"
      AI__Provider: ${AI_PROVIDER:-OpenAI}
      AI__Providers__OpenAI__Endpoint: ${OPENAI_ENDPOINT:-https://api.openai.com/v1}
      AI__Providers__OpenAI__Model: ${OPENAI_MODEL:-gpt-5.6-terra}
      AI__Providers__OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      AI__Providers__Ollama__Endpoint: ${OLLAMA_ENDPOINT:-http://ollama:11434}
      AI__Providers__Ollama__Model: ${OLLAMA_MODEL:-qwen3.5:4b}
      AI__RequestTimeoutSeconds: ${AI_REQUEST_TIMEOUT_SECONDS:-120}
      AI__Temperature: "0.3"
      AI__MaxOutputTokens: "800"
      Knowledge__RootPath: /app/knowledge-base
      Knowledge__EmbeddingModel: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      Knowledge__EmbeddingDimensions: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      Knowledge__CandidateMultiplier: ${RAG_CANDIDATE_MULTIPLIER:-4}
      Knowledge__MinimumRelevance: ${RAG_MINIMUM_RELEVANCE:-0.35}
      Mcp__Enabled: ${MCP_ENABLED:-true}
      Mcp__UseForAssistant: ${MCP_USE_FOR_ASSISTANT:-true}
      Mcp__ServerUrl: ${MCP_SERVER_URL:-http://localhost:8080/mcp}
      Mcp__ConnectionTimeoutSeconds: ${MCP_CONNECTION_TIMEOUT_SECONDS:-15}
    volumes:
      - ./knowledge-base:/app/knowledge-base:ro
    ports:
      - "5175:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nexastore-web:
    build:
      context: ./frontend/nexastore-web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      nexastore-api:
        condition: service_started
    restart: unless-stopped

volumes:
  nexastore-postgres:
  nexastore-ollama:
