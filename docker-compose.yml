name: nexastore

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - nexastore-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:0.40.6
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - nexastore-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ollama-model:
    image: ollama/ollama:0.40.6
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${OLLAMA_MODEL:-qwen3.5:4b}"]
    volumes:
      - nexastore-ollama:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  nexastore-api:
    build:
      context: .
      dockerfile: backend/NexaStore.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NexaStore: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Database__ApplyMigrationsOnStartup: "true"
      AI__Enabled: "true"
      AI__Provider: Ollama
      AI__Endpoint: http://ollama:11434
      AI__Model: ${OLLAMA_MODEL:-qwen3.5:4b}
    ports:
      - "5175:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    restart: unless-stopped

  nexastore-web:
    build:
      context: ./frontend/nexastore-web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      nexastore-api:
        condition: service_started
    restart: unless-stopped

volumes:
  nexastore-postgres:
  nexastore-ollama:
